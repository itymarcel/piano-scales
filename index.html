<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scales" />
    <meta name="description" content="A clear, pocket-sized piano scale and chord progression reference." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="./fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
    <title>Scales</title>
  </head>
  <body>
    <main class="app" id="app" data-view="scales">
      <div class="views">
        <section class="view scales" id="scales-view" aria-label="Scale viewer">
          <button class="play-button scale-play" id="scale-play" type="button" aria-label="Play scale">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2" /><path d="M12 6h.01" /><circle cx="12" cy="14" r="4" /><path d="M12 14h.01" /></svg>
          </button>
          <div class="stage">
            <div class="scale-root" id="scale-root">C</div>
            <div class="chord-keys" id="scale-keyboard"></div>
            <div class="mode-name" id="mode-name">Major · Ionian</div>
            <div class="steps" id="steps" role="img"></div>
          </div>
        </section>

        <section class="view progression" id="progression-view" aria-label="Chord progression" inert>
          <div class="slot" id="slot"></div>
        </section>
      </div>

      <nav class="dock">
        <div class="dock-row">
          <div class="pager" id="pager" aria-label="Progression slots"></div>
        </div>
        <div class="dock-row">
          <div class="segmented" aria-label="Mode">
            <span class="segmented-thumb" aria-hidden="true"></span>
            <button class="segmented-option" type="button" data-view="scales" aria-pressed="true">Scales</button>
            <button class="segmented-option" type="button" data-view="progression" aria-pressed="false">Progression</button>
          </div>
        </div>
      </nav>

      <section class="composer" id="composer" aria-label="Add chord" inert>
        <header class="composer-head">
          <p class="composer-base" id="composer-base"></p>
          <button class="switch" id="based-switch" type="button" role="switch" aria-checked="false" aria-label="Base chord on the first chord">
            <span class="switch-knob"></span>
          </button>
        </header>
        <div class="fields" id="fields"></div>
        <div class="stage">
          <div class="chord-title" id="preview-title"></div>
          <div class="chord-keys" id="preview-keyboard"></div>
        </div>
        <div class="dock">
          <div class="dock-row composer-add-row">
            <button class="play-button composer-play" id="composer-play" type="button" aria-label="Play chord">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2" /><path d="M12 6h.01" /><circle cx="12" cy="14" r="4" /><path d="M12 14h.01" /></svg>
            </button>
            <button class="add-button" id="add-chord" type="button">
              <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><path d="M6.5 1.5v10M1.5 6.5h10" /></svg>
              Add
            </button>
          </div>
          <div class="dock-row">
            <button class="back-button" id="close-composer" type="button" aria-label="Back">
              <svg width="18" height="17" viewBox="0 0 18 17" aria-hidden="true"><path d="M16.75 8.5H2.25M8.5 2.25L2.25 8.5l6.25 6.25" /></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Press and hold a speaker to set how every speaker plays: left a chord, right notes one by one. -->
      <div class="play-choice" id="play-choice" aria-hidden="true">
        <span class="play-choice-thumb"></span>
        <span class="play-choice-side" data-side="chord">
          <svg width="9" height="11" viewBox="0 0 9 11"><path d="M0 1h9M0 5.5h9M0 10h9" /></svg>
        </span>
        <span class="play-choice-side" data-side="notes">
          <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 1h8M4 5.5h8M0 10h8" /></svg>
        </span>
      </div>

      <section class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" inert>
        <div class="intro-card">
          <header class="intro-head">
            <h2 class="intro-title" id="intro-title">How to</h2>
            <button class="intro-close" id="intro-close" type="button">Close</button>
          </header>
          <ul class="intro-list">
            <li><span class="intro-icon is-key" aria-hidden="true"></span><span>Tap <b>Left &amp; Right</b> for Key</span></li>
            <li><span class="intro-icon is-mode" aria-hidden="true"></span><span>Tap <b>Up &amp; Down</b> for Mode</span></li>
            <li class="intro-install">
              <svg class="intro-icon" width="13" height="16" viewBox="0 0 13 16" aria-hidden="true"><path d="M4.25 5.75H2.5a1.25 1.25 0 0 0-1.25 1.25v6.75a1.25 1.25 0 0 0 1.25 1.25h8a1.25 1.25 0 0 0 1.25-1.25V7a1.25 1.25 0 0 0-1.25-1.25H8.75M6.5 10V1.25M4 3.5l2.5-2.5L9 3.5" /></svg>
              <span>Press <b>Share</b> and <b>Add to Home Screen</b></span>
            </li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
