<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scales" />
    <meta name="description" content="A clear, pocket-sized piano scale reference." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
    <title>Scales</title>
  </head>
  <body>
    <main class="app" id="app" aria-label="Piano scale viewer" tabindex="0">
      <div class="scale-view">
        <div class="scale-name" id="key-name">C</div>
        <div class="keyboard" id="keyboard" role="img" aria-label="C major scale on a piano keyboard"></div>
        <div class="scale-name" id="mode-name">Major · Ionian</div>
      </div>
    </main>
  </body>
</html>
